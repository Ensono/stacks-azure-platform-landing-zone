# yaml-language-server: $schema=https://raw.githubusercontent.com/Ensono/eirctl/refs/heads/main/schemas/schema_v1.json

import:
  - https://raw.githubusercontent.com/Ensono/stacks-eirctl-configurations/refs/heads/feat/initial-configs/shared/contexts.yaml
  - https://raw.githubusercontent.com/Ensono/stacks-eirctl-configurations/refs/heads/feat/initial-configs/security/linting.yaml
  - https://raw.githubusercontent.com/Ensono/stacks-eirctl-configurations/refs/heads/feat/initial-configs/infra/terraform.yaml

watchers:
  lint:
    watch: ["*.yml"]
    events: [create, write]
    task: lint:yaml
  terraform:
    watch: ["*.tf", "*.tfvars"]
    events: [create, write]
    task: lint:terraform:format

# Local Tasks
tasks:
  test:management:
    context: eir
    description: Run terraform tests for management_landing_zone module
    dir: templates/management_landing_zone/deploy/terraform
    command:
      - |
        terraform init -backend=false
        terraform test

  test:connectivity_hub_spoke:
    context: eir
    description: Run terraform tests for connectivity_landing_zone_hub_spoke module
    dir: templates/connectivity_landing_zone_hub_spoke/deploy/terraform
    command:
      - |
        terraform init -backend=false
        terraform test

  test:connectivity_virtual_wan:
    context: eir
    description: Run terraform tests for connectivity_landing_zone_virtual_wan module
    dir: templates/connectivity_landing_zone_virtual_wan/deploy/terraform
    command:
      - |
        terraform init -backend=false
        terraform test

pipelines:
  lint:
    - task: lint:yaml
    - task: lint:terraform:format
      depends_on: lint:yaml
