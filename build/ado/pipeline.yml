name: $(version_semver)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - templates/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: $(pool_vm_image)

variables:
  - template: variables.yml

stages:
  - stage: Preliminaries
    jobs:
      - job: Build_Lint
        displayName: Set Build Number and Lint
        steps:
          - template: templates/setup.yml
            parameters:
              eirctl_version: $(eirctl_version)

          - task: Bash@3
            displayName: Set Build Number
            inputs:
              targetType: inline
              script: |
                eirctl ado:build:number

          - task: Bash@3
            displayName: Perform YAML Linting
            inputs:
              targetType: inline
              script: |
                eirctl lint:yaml

          - task: Bash@3
            displayName: Perform Terraform Format Check
            inputs:
              targetType: inline
              script: |
                eirctl lint:terraform:format
