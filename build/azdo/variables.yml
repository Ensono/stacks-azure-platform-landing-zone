variables:
  # Versioning
  - name: version_major
    value: 0
  - name: version_minor
    value: 0
  - name: version_revision
    value: $[counter(join(variables['version_major'], join('-', variables['version_minor'])), 0)]
  - name: version_semver
    value: "$(version_major).$(version_minor).$(version_revision)"

  # Eirctl
  - name: eirctl_version
    value: 0.9.7

  # Tenv
  # When set to true, will install the specified Terraform version in '.terraform-version' if not installed
  - name: TENV_AUTO_INSTALL
    value: true

  # Agent Pool VM Image
  - name: pool_vm_image
    value: ubuntu-24.04
