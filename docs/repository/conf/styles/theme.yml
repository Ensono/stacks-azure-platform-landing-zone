# Extend the default theme
extends: default

page:
  size: A4
  margin: [2cm, 1.27cm, 1.27cm, 1.27cm]
  background_image: "image:../../images/page-image.png[position=top right]"

# Add extra fonts to the catalog
font:
  catalog:
    merge: true
    Opensans:
      normal: OpenSans-Regular.ttf
      italic: OpenSans-Italic.ttf
      bold: OpenSans-Bold.ttf
      bold_italic: OpenSans-BoldItalic.ttf

# State what fonts should be used
base:
  font-family: Opensans

# Configure the header to add a logo
header:
  height: $base_line_height_length * 3.5
  border_width: 0.25
  border_color: dddddd
  recto:
    columns: "<40% =20% >40%"
    left:
      content: "image:../../images/ensono.svg[Ensono Digital,100]"
    center:
      content: ""
  verso:
    left:
      content: $header_recto_left_content
    center:
      content: $header_recto_center_content

# Define the table style
table:
  caption:
    side: bottom
  head:
    background-color: "#6941eb"
    font-color: "#ffffff"

role:
  highlight:
    background-color: "#fe6e69"
  notes:
    background_color: "#6941eb"
    font_color: "#00ff00"

admonition:
  background-color: "#f5f5f5"
  border-color: "#e0e0e0"
  border-radius: 3
  border-width: [0, 0, 0, 3]
  padding: [8, 12, 8, 12]
  column-rule-width: 0
  label:
    font-style: bold
    text-transform: uppercase
    note:
      font-color: "#337ab7"
    tip:
      font-color: "#00a651"
    warning:
      font-color: "#f0ad4e"
    caution:
      font-color: "#fe6e69"
    important:
      font-color: "#d9534f"

heading:
  font-color: "#6941eb"

footer:
  recto:
    right:
      content: "{page-number}"
  verso:
    right:
      content: "{page-number}"
